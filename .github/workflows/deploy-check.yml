# OWNER: Tray (deployment) · results reviewed by Vincent (QA)
# After a merge to main, wait until Vercel's production deployment is serving that commit
# (via /api/health "commit"), then run the E2E suite against the live URL.
# Vercel doesn't create GitHub "deployment" events for this project, so we poll instead.
# Also runnable by hand: Actions -> "Deployment check" -> Run workflow.
name: Deployment check

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "API base URL"
        default: "https://ai-product-label-verification.vercel.app/api"
      full:
        description: "Also run tests that CREATE specs + inspections (adds rows to that database)"
        type: boolean
        default: false

jobs:
  e2e-deployed:
    name: End-to-end (deployed)
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://ai-product-label-verification.vercel.app/api' }}
      # Read-only by default: don't fill the live demo database with test data on every merge.
      E2E_READONLY: ${{ inputs.full && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production to serve this commit
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 40); do
            live=$(curl -sf "$E2E_BASE_URL/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" || true)
            [ "$live" = "$GITHUB_SHA" ] && echo "Production is on $GITHUB_SHA" && exit 0
            echo "waiting ($i/40): production on '${live:-unreachable}'"; sleep 15
          done
          echo "::error::Production never served $GITHUB_SHA within 10 minutes. Check the Vercel dashboard."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - name: Run E2E against production
        working-directory: tests/e2e
        run: |
          echo "Testing $E2E_BASE_URL"
          pytest -q -rx
