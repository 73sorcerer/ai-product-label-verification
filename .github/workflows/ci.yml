# OWNER: Tray (deployment/integration) · Vincent reviews test results (QA)
# Runs on every PR and every push to main. Vercel's GitHub integration deploys separately
# (preview per PR, production on main); deploy-check.yml then tests the live deployment.
#
# Required to merge (branch protection): Backend unit tests, End-to-end (local server), Frontend lint + build.
# NOT required: MVP completeness. It fails while any route is unbuilt, so it shows real progress
# without blocking teammates' PRs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Agent skill copies match
        working-directory: .
        # Muse Code loads skills from .agents/skills/; skills/ is the course deliverable. Keep them identical.
        run: diff -r skills/labelguard-testing/SKILL.md .agents/skills/labelguard-testing/SKILL.md

  e2e-local:
    name: End-to-end (local server)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt
      - run: pip install -r backend/requirements.txt -r tests/requirements.txt
      - name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          echo "API did not start" && exit 1
      - name: Run E2E
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://localhost:8000
        run: pytest -q -rx

  mvp-completeness:
    name: MVP completeness (strict E2E)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - id: gate
        # Strict mode starts Sat Oct 17 (the "working local workflow" milestone). Before that it's skipped.
        run: |
          if [ "$(date -u +%Y%m%d)" -lt 20261017 ]; then
            echo "::notice::Strict MVP check starts 2026-10-17; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r backend/requirements.txt -r tests/requirements.txt
      - if: steps.gate.outputs.run == 'true'
        name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          exit 1
      - if: steps.gate.outputs.run == 'true'
        name: Run E2E (strict; unbuilt routes fail)
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_STRICT: "1"
        run: pytest -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - id: check
        working-directory: .
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'false'
        run: echo "::notice::frontend/package.json not found yet; skipping frontend checks"
        working-directory: .
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.exists == 'true'
        run: npm ci
      - if: steps.check.outputs.exists == 'true'
        run: npm run lint --if-present
      - if: steps.check.outputs.exists == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
