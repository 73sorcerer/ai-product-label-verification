# OWNER: Vincent. STUB: runs backend tests; extend with frontend checks and deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  # TODO(Vincent): frontend job (npm ci, lint, typecheck, build) once frontend/ is scaffolded
  # TODO(Vincent): deploy jobs (frontend + backend) gated on main
